name: build-axslevel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 下载源码
        run: |
          set -e
          mkdir -p out
          curl -fsSL -o AxsLevel.m    "https://aka.doubaocdn.com/s/31HdnewCl8"
          curl -fsSL -o axs_lv.c      "https://aka.doubaocdn.com/s/UA9ZZeGhAP"
          curl -fsSL -o axs_load.lua  "https://aka.doubaocdn.com/s/7F2eT7K47k"
          curl -fsSL -o ent.plist     "https://aka.doubaocdn.com/s/U5ysv6B7Kv"
          wc -l AxsLevel.m axs_lv.c axs_load.lua
          head -3 AxsLevel.m

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 编译 arm64e
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 -isysroot "$SDK" -dynamiclib -O2 -fobjc-arc -framework Foundation -framework AudioToolbox -install_name /var/jb/Library/AxsEQ/AxsLevel.dylib -o out/AxsLevel.dylib AxsLevel.m
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 -isysroot "$SDK" -O2 -o out/axs_lv axs_lv.c

      - name: 签名
        run: |
          set -e
          brew install ldid 2>/dev/null || true
          if command -v ldid >/dev/null; then
            ldid -Sent.plist out/AxsLevel.dylib
            ldid -Sent.plist out/axs_lv
          else
            codesign -s - --entitlements ent.plist -f out/AxsLevel.dylib
            codesign -s - --entitlements ent.plist -f out/axs_lv
          fi

      - name: 校验架构
        run: |
          lipo -info out/AxsLevel.dylib
          otool -hv out/AxsLevel.dylib | head -6

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: axslevel-arm64e
          path: |
            out/AxsLevel.dylib
            out/axs_lv
            axs_load.lua
            ent.plist

        
