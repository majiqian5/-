name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid xz || true
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          curl -sL https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p "$HOME/theos/sdks"
          cp -r sdks-master/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          ls "$HOME/theos/sdks"

      - name: Build rootless
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          ls -l packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IslandHLS-deb
          path: packages/*.deb
          if-no-files-found: error
