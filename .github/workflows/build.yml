name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          brew install ldid xz || true

          # Theos 本体（自带一个空的 sdks 目录）
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

          # SDK 只能在临时目录里 clone 再整体搬过去：既避开已存在的 sdks 目录，也用 git 保住 framework 的符号链接
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS16.5.sdk
          git checkout
          cd "$HOME"
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"

          echo "已安装 SDK:"
          ls -1 "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/UIKit.framework"
          test -f "$HOME/theos/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/UIKit.framework/UIKit"

      - name: Build rootless
        run: |
          set -e
          export THEOS="$HOME/theos"
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          echo "产物:"
          ls -l packages/

      - name: Verify arm64e ABI
        run: |
          set -e
          DYLIB=.theos/obj/arm64e/IslandHLS.dylib
          file "$DYLIB"
          python3 -c "import struct;d=open('$DYLIB','rb').read();print('cpusubtype=%#x (期望 0x80000002)' % struct.unpack('<I',d[8:12])[0])"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IslandHLS-deb
          path: packages/*.deb
          if-no-files-found: error
